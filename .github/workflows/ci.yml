name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/ocpp-lab
      - uses: azure/setup-helm@v4
      - run: helm lint charts/ocpp-lab && helm template smoke charts/ocpp-lab > /dev/null
